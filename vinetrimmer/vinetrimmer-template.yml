# The style written into generated ASS files. Only applies to ASS that vinetrimmer
# generates - a service that hands out real ASS (Crunchyroll does, for some of its
# catalogue) keeps its own styling untouched.
#
# The font is NOT chosen here by default. A WebVTT that declares one in a STYLE block
#   STYLE
#   ::cue { font-family: "Some Font"; }
# has that font used and embedded. A subtitle that declares nothing gets the plain
# default below, and no font is invented for it or attached.
#
# Sizes are measured against a 1920x1080 script resolution, which libass scales to
# whatever the video is, so 54 looks the same on a 720p file as on a 4k one.
subtitle_style:
  default:
    font: 'Arial'
    size: 54

  # Adding a service here OVERRIDES whatever the subtitle asks for, forcing that font
  # on every track from that service and fetching it if it is not already cached. Left
  # commented out, the subtitle decides. Names are the family as recorded in the font
  # file - use exactly these:
  #   Netflix       'Netflix Sans'      or 'Roboto'
  #   DisneyPlus    'Inspire'
  #   HBOMax        'Handset Sans UI',  or 'Cinecav Casual' / 'Cinecav Mono'
  #   Crunchyroll   'Crunchyroll Atyp'  or 'DM Sans'
  #   AppleTVPlus   'SF Pro'            or 'SF Pro Display'
  #
  # Only the Cinecav pair are caption faces; the rest are the site/app UI fonts, so
  # forcing one is a look you choose rather than what the service actually renders.
  # They also only cover the scripts their player's UI needs - none carry Hebrew, Thai
  # or CJK, and Inspire has no Cyrillic - so a track the font cannot render falls back
  # to the default automatically rather than turning into boxes.
  #
  # Netflix:     {font: 'Netflix Sans'}
  # DisneyPlus:  {font: 'Inspire'}
  # HBOMax:      {font: 'Cinecav Casual'}
  # Crunchyroll: {font: 'Crunchyroll Atyp'}
  # AppleTVPlus: {font: 'SF Pro'}

# Attach the fonts that ASS subtitles reference to the muxed file, taking them from
# the fonts directory above. Only the families actually referenced are attached, and
# only once each however many subtitle tracks want them. Families every player
# already has (Arial, Verdana, ...) are skipped, since attaching them adds size for
# no benefit. Set to false to mux without attachments.
attach_fonts: true

# When a subtitle asks for a font that is not in the fonts directory, fetch it from
# the service's own CDN. Only triggers on a font that is actually missing, only for
# the services the subtitles came from, and each file is downloaded once ever - after
# that the local copy is reused and nothing is requested. Set to false to stay
# entirely offline and supply fonts by hand.
download_fonts: true

