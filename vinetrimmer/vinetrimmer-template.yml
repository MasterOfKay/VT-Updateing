# Whether to write a log file for each run to the logs directory.
# Set to false to only log to the console and avoid accumulating log files.
generate_logs: false

arguments: {}

aria2c:
  file_allocation: 'prealloc'

downloads:
  # Number of tracks to download concurrently (parallel downloads).
  # Either a plain number (applies to all services) or a per-service dict
  # with a 'default', same pattern as the `downloader:` section below.
  # Set to 1 for sequential downloads.
  concurrent_tracks:
    default: 2
    # DisneyPlus's CDN throttles/blocks hard when too many connections are
    # opened at once (each track already opens many aria2c connections on
    # its own) - keep this low or downloads stall out with "Aria2c stalled"
    # errors.
    DisneyPlus: 2

  # Number of subtitle tracks to download concurrently, using a separate
  # worker pool from concurrent_tracks above. Subtitles are small/fast, so
  # this pool starts downloading immediately alongside the video/audio pool
  # instead of waiting for a video/audio worker to free up.
  # Set to 1 to download subtitles one at a time (still in parallel with
  # video/audio). Set to 0 to disable and fold subtitles back into the
  # normal concurrent_tracks pool.
  concurrent_subtitle_downloads:
    default: 4
    # Disabled for DisneyPlus - see note above, the extra subtitle pool
    DisneyPlus: 2

  # Draw the live progress tree during downloads. Set to false to print plain
  # "Downloaded: <track>" log lines instead.
  # Every crash_*.log so far faulted inside the thread that renders this tree,
  # so turning it off is both the workaround and the test for whether the
  # display is what's killing the process.
  progress_display:
    default: true

downloader:
  # Choose downloader for each service: 'aria2c' or 'N_m3u8DL-RE'
  # N_m3u8DL-RE is better for HLS/DASH streams and Smooth Streaming (ISM)
  # aria2c is better for simple direct downloads
  default: 'N_m3u8DL-RE'
  DisneyPlus: 'aria2c'
