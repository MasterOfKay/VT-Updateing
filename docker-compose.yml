# docker compose up -d --build     (see DOCKER.md)
services:
  vt:
    build: .
    image: vt-pr-wv:local
    container_name: vt-pr-wv
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # The web UI has no login and manages your credentials: keep it on this computer.
      - "127.0.0.1:8787:8787"
      # External API (switch it on under Settings). "8788:8788" opens it to your network.
      - "127.0.0.1:8788:8788"
    volumes:
      # Your accounts, devices, keys, settings and downloads.
      - ./docker-data:/data
      # The installation folder, read-only: first-start copy and service updates.
      - .:/import:ro
    # On Linux, to own the downloaded files as your own user:
    # user: "1000:1000"
